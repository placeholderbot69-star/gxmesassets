```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMONGUSGXMES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;

            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            background: #111;
            cursor: pointer;
        }

        #startScreen h1 {
            font-size: 4rem;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 2rem;
        }

        #startScreen p {
            font-size: 1.2rem;
            color: #aaa;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: #222;
            transition: 0.3s;
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }

        #sidebar.active {
            left: 0;
        }

        .sidebar-icon {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: #333;
            border-radius: 5px;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: #444;
        }

        #proxyContainer {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: #222;
            z-index: 998;
            border-radius: 10px;
            padding: 20px;
        }

        #proxyContainer.active {
            display: block;

        #proxyBar {
            display: flex;
            justify-content: space-between;
            align-items: center;

        #urlInput {
            flex-grow: 1;
            padding: 8px;

            border: none;

            border-radius: 3px;
        }

        #proxyFrame {
            width: 100%;

<body>
    <div id="startScreen">
        <h1>AMONGUSGXMES</h1>
        <p>Hold mouse to continue</p>
    </div>

    <div id="sidebar">
        <div class="sidebar-item" id="browserBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/2965/2965300.png" class="sidebar-icon" alt="Browser">
            <span>Browser</span>
        </div>
        <div class="sidebar-item" id="gamesBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/3659/3659898.png" class="sidebar-icon" alt="Games">
            <span>Games</span>
        </div>
        <div class="sidebar-item" id="moviesBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png" class="sidebar-icon" alt="Movies">
            <span>Movies</span>
        </div>
        <div class="sidebar-item" id="settingsBtn">
            <img src="https://cdn-icons-png.flaticon.com/512/3659/3659903.png" class="sidebar-icon" alt="Settings">
            <span>Settings</span>
        </div>
    </div>

    <div id="proxyContainer">
        <div id="proxyBar">
            <input type="text" id="urlInput" placeholder="Enter website URL">
            <button id="goBtn">GO</button>
        </div>
        <iframe id="proxyFrame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </div>

    <div id="gamesContainer">
        <h2>Games</h2>
        <div id="gamesGrid">
            <!-- Games will be loaded dynamically -->
        </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h2>Settings</h2>
        <div class="settings-option">
            <label>Theme Color:</label>
            <input type="color" id="themeColor" value="#ff0000">
        </div>
        <div class="settings-option">
            <label>Background Color:</label>
            <input type="color" id="bgColor" value="#000000">
        </div>
        <button id="saveSettings">Save Settings</button>
    </div>

    <div id="particles-js"></div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize particles
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#ff0000" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#ff0000", opacity: 0.4, width: 1 },
                    move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    },
                    modes: {
                        repulse: { distance: 100, duration: 0.4 }
                    }
                }
            });

            // Start screen interaction
            const startScreen = document.getElementById('startScreen');
            let holdTimer;

            startScreen.addEventListener('mousedown', function() {
                holdTimer = setTimeout(function() {
                    document.getElementById('sidebar').classList.add('active');
                    startScreen.style.opacity = '0';
                    setTimeout(() => {
                        startScreen.style.display = 'none';
                    }, 300);
                }, 1000);
            });

            startScreen.addEventListener('mouseup', function() {
                clearTimeout(holdTimer);
            });

            startScreen.addEventListener('mouseleave', function() {
                clearTimeout(holdTimer);
            });

            // Sidebar interactions
            document.getElementById('browserBtn').addEventListener('click', function() {
                document.getElementById('proxyContainer').classList.add('active');
            });

            document.getElementById('gamesBtn').addEventListener('click', function() {
                document.getElementById('gamesContainer').classList.add('active');
                loadGames();
            });

            document.getElementById('moviesBtn').addEventListener('click', function() {
                document.getElementById('proxyContainer').classList.add('active');
                document.getElementById('urlInput').value = 'https://toustream.movietrunk.com/';
                document.getElementById('goBtn').click();
            });

            document.getElementById('settingsBtn').addEventListener('click', function() {
                document.getElementById('settingsPanel').classList.add('active');
            });

            // Proxy functionality
            document.getElementById('goBtn').addEventListener('click', function() {
                let url = document.getElementById('urlInput').value.trim();
                if (!url.startsWith('http')) {
                    url = 'http://' + url;
                }
                document.getElementById('proxyFrame').src = `https://cors-anywhere.herokuapp.com/${url}`;
            });

            // Load games from gnmath.global.ssl.fastly.net
            function loadGames() {
                const gamesGrid = document.getElementById('gamesGrid');
                gamesGrid.innerHTML = '';
                
                // Sample games - in a real scenario you would fetch these from the API
                const games = [
                    { name: "1v1.LOL", url: "https://gnmath.global.ssl.fastly.net/1v1-lol" },
                    { name: "Among Us", url: "https://gnmath.global.ssl.fastly.net/among-us" },
                    { name: "Minecraft", url: "https://gnmath.global.ssl.fastly.net/minecraft" },
                    { name: "Slither.io", url: "https://gnmath.global.ssl.fastly.net/slither" },
                    { name: "Temple Run", url: "https://gnmath.global.ssl.fastly.net/temple-run" },
                    { name: "Tetris", url: "https://gnmath.global.ssl.fastly.net/tetris" },
                    { name: "Subway Surfers", url: "https://gnmath.global.ssl.fastly.net/subway-surfers" },
                    { name: "Fortnite", url: "https://gnmath.global.ssl.fastly.net/fortnite" }
                ];

                games.forEach(game => {
                    const gameElement = document.createElement('div');
                    gameElement.className = 'game-item';
                    gameElement.innerHTML = `
                        <img src="https://cdn-icons-png.flaticon.com/512/3659/3659898.png" class="game-icon" alt="${game.name}">
                        <div>${game.name}</div>
                    `;
                    gameElement.addEventListener('click', function() {
                        document.getElementById('proxyContainer').classList.add('active');
                        document.getElementById('urlInput').value = game.url;
                        document.getElementById('goBtn').click();
                    });
                    gamesGrid.appendChild(gameElement);
                });
            }

            // Settings functionality
            document.getElementById('saveSettings').addEventListener('click', function() {
                const themeColor = document.getElementById('themeColor').value;
                const bgColor = document.getElementById('bgColor').value;
                
                // Update colors
                document.body.style.backgroundColor = bgColor;
                document.querySelector('h1').style.color = themeColor;
                
                // Update particles
                particlesJS('particles-js', {
                    particles: {
                        color: { value: themeColor },
                        line_linked: { color: themeColor }
                    }
                });
                
                document.getElementById('settingsPanel').classList.remove('active');
            });

            // Close panels when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#sidebar') && !e.target.closest('#startScreen')) {
                    document.getElementById('sidebar').classList.remove('active');
                }
                
                if (!e.target.closest('#proxyContainer') && !e.target.closest('#browserBtn') && !e.target.closest('#moviesBtn')) {
                    document.getElementById('proxyContainer').classList.remove('active');
                }
                
                if (!e.target.closest('#gamesContainer') && !e.target.closest('#gamesBtn')) {
                    document.getElementById('gamesContainer').classList.remove('active');
                }
                
                if (!e.target.closest('#settingsPanel') && !e.target.closest('#settingsBtn')) {
                    document.getElementById('settingsPanel').classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
